server:
  shutdown: graceful

spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/villaserena}
    username: ${SPRING_DATASOURCE_USERNAME:villaserena}
    password: ${SPRING_DATASOURCE_PASSWORD:villaserena}
  flyway:
    locations:
      - classpath:db/migration

hotel:
  timezone: ${HOTEL_TIMEZONE:America/Guatemala}
